quarkus:
  application:
    name: onboarding-bff
  shutdown:
    delay-enabled: true
    delay: 5s
    timeout: 10s
  http:
    port: ${HTTP_PORT:8100}
    test-port: 18100
  jackson:
    serialization-inclusion: NON_NULL
  devservices:
    enabled: false
  log:
    level: ${LOG_LEVEL:INFO}
  smallrye-openapi:
    path: /swagger
  liquibase:
    migrate-at-start: true
    change-log: db/changeLog.xml
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:onboarding}
    # Secret: no default; must be supplied via the environment (.env locally, see .env.example).
    password: ${DB_PASSWORD}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onboarding}?currentSchema=${DB_SCHEMA:public}

mp:
  openapi:
    scan:
      # The hand-written contract (META-INF/openapi.yaml) is authoritative: API-first, no generated model.
      disable: true
